<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 90

    ProxyPass        /socket.io/ http://127.0.0.1:8080/socket.io/ upgrade=websocket retry=0
    ProxyPassReverse /socket.io/ http://127.0.0.1:8080/socket.io/
    ProxyPass        /mqtt       http://127.0.0.1:8080/mqtt upgrade=websocket retry=0
    ProxyPassReverse /mqtt       http://127.0.0.1:8080/mqtt
    ProxyPass        /           http://127.0.0.1:8080/ retry=0
    ProxyPassReverse /           http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/classpulse-error.log
    CustomLog ${APACHE_LOG_DIR}/classpulse-access.log combined
</VirtualHost>
