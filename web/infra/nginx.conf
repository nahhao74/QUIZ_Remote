server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Question imports and AI teaching material accept files up to 20 MB (multipart adds some overhead).
  client_max_body_size 25m;
  # Rendered as a template: NGINX_LOCAL_RESOLVERS is the container DNS. Proxying through variables makes nginx
  # re-resolve backend/emqx, so recreating those containers (new IP) does not leave the site answering 502.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
  set $backend_upstream http://backend:3000;
  set $emqx_upstream http://emqx:8083;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /socket.io/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }
  location /mqtt {
    proxy_pass $emqx_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_read_timeout 75s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
