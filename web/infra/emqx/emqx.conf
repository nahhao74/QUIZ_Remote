# EMQX Community 5.8.8: authentication chain rejects unknown/missing credentials.
node { name = "emqx@emqx.local", data_dir = "/opt/emqx/data" }
log.console.enable = true
dashboard.listeners.http.bind = 18083
listeners.tcp.default.bind = "0.0.0.0:1883"
listeners.ws.default { bind = "0.0.0.0:8083", websocket.mqtt_path = "/mqtt" }
authentication = [{
  mechanism = password_based
  backend = built_in_database
  user_id_type = username
  password_hash_algorithm { name = sha256, salt_position = suffix }
  bootstrap_file = "/emqx-config/auth.json"
  bootstrap_type = plain
}]
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [{ type = file, enable = true, path = "/emqx-config/acl.conf" }]
}
